<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sismoPUCP · Entregas</title><link rel="stylesheet" href="css/app.css"><style>body{background:#eef3f6;font:16px Arial;color:#213744}main{max-width:1100px;margin:24px auto;padding:20px}section{background:white;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:12px 0 5px}input,select{padding:12px;max-width:100%;width:320px;box-sizing:border-box}button{padding:12px;margin:8px 8px 8px 0;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}#teacherStatus{overflow-wrap:anywhere}</style></head><body><main><a href="index.html">sismoPUCP · Taller</a><h1>Entregas de alumnos</h1><section id="login"><h2>Acceso docente</h2><form id="loginForm"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña de tu usuario docente</label><input id="password" type="password" autocomplete="current-password" required><br><button id="signIn">Entrar</button></form></section><p id="teacherStatus" role="status"></p><section id="dashboard" hidden><button id="reload">Actualizar</button><button id="csv">Descargar CSV para Excel</button><button id="signOut">Cerrar sesión</button><h2>Sesiones del taller</h2><div id="sessions"></div><h2>Entregas recibidas</h2><label for="sessionFilter">Sesión</label><select id="sessionFilter"><option value="">Todas las sesiones</option></select><div id="teacherCount"></div><div class="scroll"><table><thead><tr><th>Fecha (Lima)</th><th>Alumno</th><th>Institución</th><th>Equipo</th><th>Fichas</th><th>Detalle</th></tr></thead><tbody id="deliveries"></tbody></table></div><button id="more" hidden>Cargar más entregas</button><article id="detail" hidden><h2>Respuestas de la entrega</h2><pre id="detailText"></pre></article></section></main><script src="js/entregas-config.js"></script><script src="js/docente.js"></script></body></html>
